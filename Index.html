<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        main {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <header>
        <h1>ยินดีต้อนรับสู่เว็บแรกของฉัน</h1>
    </header>

    <main>
        <h2>เกี่ยวกับฉัน</h2>
        <p>นี่คือหน้าเว็บ HTML อย่างง่ายที่สร้างขึ้นด้วยโครงสร้างพื้นฐาน มีทั้งข้อความ ปุ่ม และตาราง</p>

        <h2>สิ่งที่สนใจ</h2>
        <ul>
            <li>การเขียนโปรแกรม</li>
            <li>การออกแบบเว็บไซต์</li>
            <li>การเรียนรู้สิ่งใหม่ๆ</li>
        </ul>

        <h2>ติดต่อ</h2>
        <button onclick="alert('ขอบคุณที่สนใจติดต่อเรา!')">คลิกเพื่อติดต่อ</button>
    </main>

</body>
</html>
